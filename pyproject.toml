[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resipsc"
version = "2.0.0"
description = "Residual pluripotent stem cell detection for cell therapy QC (Research Use Only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "xgboost>=2.0",
  "anndata>=0.10",
  "h5py>=3.10",
  "matplotlib>=3.9",
  "harmonypy>=0.0.24",
  "reportlab>=4.0",
]

[tool.setuptools.packages.find]
include = ["resipsc*"]
