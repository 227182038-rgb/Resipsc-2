version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - \"6379:6379\"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [\"CMD\", \"redis-cli\", \"ping\"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.v3
    ports:
      - \"8000:8000\"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RESIPSC_DATA_DIR=/app/data
      - RESIPSC_MODEL_DIR=/app/models
      - RESIPSC_RESULTS_DIR=/app/results
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

  worker:
    build:
      context: .
      dockerfile: Dockerfile.v3
    command: celery -A src.api.celery_app worker --loglevel=info --concurrency=2
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - RESIPSC_DATA_DIR=/app/data
      - RESIPSC_MODEL_DIR=/app/models
      - RESIPSC_RESULTS_DIR=/app/results
      - RESIPSC_ZARR_CACHE=/app/cache/zarr
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./results:/app/results
      - ./cache:/app/cache
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

volumes:
  redis_data:
